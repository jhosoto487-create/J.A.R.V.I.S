name: Compilar APK JARVIS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar APK con Buildozer (Docker)
        uses: redroid/buildozer-action@v1
        with:
          command: android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
