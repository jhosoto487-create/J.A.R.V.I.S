name: Compilar APK JARVIS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema para Buildozer
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-setup \
            git \
            git-core \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            ant \
            ccache \
            autoconf \
            libtool \
            libltdl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK con Buildozer
        uses: ClementGre/buildozer-action@v0.5.0
        with:
          target: android
          command: debug
          buildozer_version: master

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
